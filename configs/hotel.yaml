data_dir: processed_data_sf
topk_ped: 6
sight_angle_ped: 90
dist_threshold_ped: 4
topk_obs: 5
sight_angle_obs: 90
dist_threshold_obs: 4
skip_frames: 25
num_history_feature: 8
num_history_velocity: 1
train_mode: multi

k_eval: 25

seed: 777 #456
eval_every: 1

# Data Parameters:
device: cuda
note: None

ode_method:  'euler'                              
odeint_atol: 0.0001
odeint_rtol: 0.001
grid_size: 7.0
tau1: 1.0
