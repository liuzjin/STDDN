# dataset
save_model: True
finetune: True
resume: False
total_epochs: 200
data_config:  ./configs/data_configs/data_finetune_hotel.yaml
rebuild_dataset: True
data_dict_path: ./dataset_built/pretrain_hotel_1104_trainonreal_mt_fn10_t3v1.pkl

finetune_trainmode: multistep # singlestep/multistep
time_decay: 0.9
use_col_focus_loss: False
