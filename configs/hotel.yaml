############ STDDN Config #############
# optimizer
lr: 0.01
# nei_attn_mask: True
nei_padding_mask: True
batch_size: 32

val_mode: multistep
# Training Prarmeters:
diffnet: ped_inter_geometric_cond_w_obs_w_history  

spatial_emsize: 32
dropout: 0.0 #0.1 0.3
esti_goal: acce # acce, pos

history_dim: 6 # if esti_goal==acce 6 else 2d
history_emsize: 64
history_lstm: 64
history_lstm_out: 64

history_nhead: 4
history_num_layers: 8

